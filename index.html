<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studies in the Space Between</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #f2ead6;
    --paper-deep: #e9dcbd;
    --ink: #332c22;
    --ink-soft: #7a6c56;
    --margin-red: #a3402f;
    --desk: #2c2820;
    --desk-deep: #201d17;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse at 50% -10%, #3a352b 0%, transparent 60%),
      linear-gradient(180deg, var(--desk) 0%, var(--desk-deep) 100%);
    color: var(--ink);
    font-family: 'Cormorant Garamond', 'Iowan Old Style', Georgia, serif;
  }

  a{ color: inherit; }

  /* ---------- site chrome ---------- */

  .site-nav{
    position: fixed;
    top: 0; left: 0; right: 0;
    display:flex;
    justify-content: center;
    align-items: center;
    padding: 26px 24px;
    z-index: 20;
    flex-wrap: wrap;
  }
  .site-nav a{
    font-style: italic;
    font-size: 17px;
    color: #cfc3a8;
    text-decoration: none;
    letter-spacing: 0.02em;
    opacity: 0.5;
    border-bottom: 1px solid transparent;
    transition: border-color 0.25s ease, color 0.25s ease, opacity 0.25s ease;
    margin: 0 10px;
  }
  .site-nav a:hover{
    opacity: 1;
    color: #f2ead6;
    border-color: rgba(242,234,214,0.5);
  }
  .site-nav a.active{
    opacity: 1;
    color: #f2ead6;
    border-color: rgba(242,234,214,0.3);
  }
  .site-nav .sep{
    color: #6b6252;
    font-size: 14px;
  }

  /* ---------- the page itself ---------- */

  main{
    display:flex;
    justify-content:center;
    padding: 100px 24px 80px;
  }

  .leaf{
    position: relative;
    width: 100%;
    max-width: 680px;
    min-height: 840px;
    background: var(--paper);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.4) inset,
      0 30px 60px rgba(0,0,0,0.45),
      0 4px 14px rgba(0,0,0,0.35);
    padding: 64px 56px 56px 108px;
    display:flex;
    flex-direction: column;
    opacity: 0;
    transform: translateY(10px);
    animation: settle 0.6s ease forwards;
  }

  @keyframes settle{
    to{ opacity:1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce){
    .leaf{ animation: none; opacity:1; transform:none; }
  }

  .leaf::before{
    /* the red margin rule */
    content: '';
    position: absolute;
    top: 0; bottom: 0;
    left: 72px;
    width: 1px;
    background: var(--margin-red);
    opacity: 0.7;
  }

  .leaf::after{
    /* faint paper vignette, darkest at the edges */
    content:'';
    position:absolute; inset:0;
    box-shadow: inset 0 0 70px rgba(120,100,60,0.10);
    pointer-events:none;
  }

  .illustration{
    min-height: 170px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .illustration img{
    max-width: 100%;
    max-height: 240px;
    display:block;
  }

  .content{
    flex: 1;
    display:flex;
    flex-direction: column;
    justify-content: center;
    padding: 12px 0;
  }

  h1.title{
    text-align:center;
    font-style: italic;
    font-weight: 600;
    font-size: 40px;
    margin: 0 0 14px;
    color: var(--ink);
  }

  .rule{
    width: 64px;
    height: 1px;
    background: var(--ink-soft);
    opacity: 0.5;
    margin: 0 auto 40px;
  }

  .stanza{
    margin: 0 0 28px;
  }
  .stanza:last-child{ margin-bottom: 0; }

  .stanza p{
    margin: 0;
    text-align: center;
    font-size: 21px;
    line-height: 1.65;
    color: var(--ink);
  }
  .stanza p.italic{ font-style: italic; }

  .postscript{
    font-family: 'Mrs Saint Delafield', cursive;
    font-size: 26px;
    text-align: center;
    color: var(--ink-soft);
    margin: 30px 0 0;
    opacity: 0.85;
  }
  .postscript a{
    color: inherit;
    text-decoration: none;
    border-bottom: 1px dotted currentColor;
  }
  .postscript a:hover{ opacity: 1; }

  .prose p{
    text-align: left;
    font-size: 20px;
    line-height: 1.85;
    color: var(--ink);
    margin: 0 0 22px;
    max-width: 62ch;
    margin-left:auto;
    margin-right:auto;
  }

  .foot-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid rgba(51,44,34,0.12);
    font-size: 17px;
    font-style: italic;
    color: var(--ink-soft);
    flex-shrink:0;
  }
  .foot-nav a{
    text-decoration:none;
    color: var(--ink-soft);
    transition: color 0.2s ease;
  }
  .foot-nav a:hover{ color: var(--ink); }
  .foot-nav .disabled{ visibility:hidden; }
  .foot-nav .num{ letter-spacing: 0.06em; }

  /* ---------- cover / contents page ---------- */

  .cover-title{
    text-align:center;
    font-family: 'Mrs Saint Delafield', cursive;
    font-size: 64px;
    color: var(--ink);
    margin: 10px 0 4px;
    line-height: 1.1;
  }
  .cover-sub{
    text-align:center;
    font-style: italic;
    font-size: 18px;
    color: var(--ink-soft);
    margin: 0 auto 46px;
    max-width: 34ch;
  }

  .toc{
    list-style: none;
    margin: 0 auto;
    padding: 0;
    max-width: 420px;
  }
  .toc li{
    display:flex;
    align-items: baseline;
    gap: 26px;
    padding: 13px 0;
    border-bottom: 1px solid rgba(51,44,34,0.1);
  }
  .toc li:last-child{ border-bottom:none; }
  .toc .num{
    font-style: italic;
    color: var(--ink-soft);
    font-size: 17px;
    width: 2.4em;
    flex-shrink:0;
    text-align:right;
    padding-right: 4px;
  }
  .toc a{
    text-decoration:none;
    color: var(--ink);
    font-size: 21px;
    flex:1;
    border-bottom: 1px solid transparent;
    transition: border-color 0.2s ease, opacity 0.2s ease;
  }
  .toc a:hover{ border-color: var(--margin-red); }

  @media (max-width: 640px){
    main{ padding: 88px 10px 60px; }
    .leaf{ padding: 44px 20px 36px 46px; min-height: 720px; }
    .leaf::before{ left: 26px; }
    h1.title{ font-size: 30px; }
    .cover-title{ font-size: 42px; }
    .stanza p, .prose p{ font-size: 18px; }
    .postscript{ font-size: 21px; }
    .toc a{ font-size: 19px; }
    .site-nav{ padding: 18px 14px; }
    .site-nav a{ font-size: 15px; margin: 0 6px; }
  }

  @media (max-width: 380px){
    .stanza p, .prose p{ font-size: 16.5px; }
  }

  .site-signature{
    position: fixed;
    bottom: 22px;
    left: 32px;
    font-family: 'Mrs Saint Delafield', cursive;
    font-size: 22px;
    color: rgba(207, 195, 168, 0.16);
    letter-spacing: 0.02em;
    pointer-events: none;
    z-index: 5;
    user-select: none;
  }

  @media (max-width: 640px){
    .site-signature{ font-size: 18px; left: 18px; bottom: 14px; }
  }
</style>
</head>

<script>
/* ============ CONTENT ============
   The site holds one or more collections. Add new poems (or, later,
   stories) inside the right collection's `works` array. To start a
   new collection, add another object to `collections` below.

   type: "poem"  -> stanzas: array of stanzas, each an array of
                     { text, italic? }
   type: "story" -> paragraphs: array of strings
   illustrationTop / illustrationBottom: optional image URLs.
=================================== */
var collections = [
  {
    slug: "space-between",
    title: "Studies in the Space Between",
    subtitle: "Thoughts about the space between people, and the things that live there.",
    works: [
  {
    slug: "lets-just-say",
    type: "poem",
    title: "Let\u2019s Just Say",
    stanzas: [
      [{text:"When we meet again after all these years,"},{text:"what tales will we even tell."}],
      [{text:"Trying to fold decades in minutes,"},{text:"and at that beautifully fail."}],
      [{text:"Let\u2019s just say a few lies,"},{text:"and smile them into truth."}],
      [{text:"The conversation will never reach"},{text:"the place where the pain begins."}],
      [{text:"We\u2019ve both gotten so good at this,"},{text:"smiling away whatever needed to be said."}]
    ]
  },
  {
    slug: "im-fine",
    type: "poem",
    title: "I\u2019m fine",
    stanzas: [
      [
        {text:"A door held shut, from the inside, politely,"},
        {text:"so you won\u2019t have to see, what it\u2019s holding back."},
        {text:"Somewhere, someone is always saying it,"},
        {text:"somewhere, someone always knows,"},
        {text:"it isn\u2019t true, and lets it go anyway.", italic:true}
      ]
    ]
  },
  {
    slug: "half-open",
    type: "poem",
    title: "Half Open",
    stanzas: [
      [{text:"A book sitting on the ledge,"},{text:"hoping to catch a breeze to turn the page."}],
      [{text:"A half open curtain on the window,"},{text:"leaving room for the morning to wander in."}],
      [
        {text:"The fleeting moments of life,"},
        {text:"writing new stories before the last one ends,"},
        {text:"already dissolving into ether.", italic:true}
      ]
    ]
  },
  {
    slug: "doing-the-dishes",
    type: "poem",
    title: "Doing the Dishes",
    stanzas: [
      [
        {text:"Like the rain that came without warning,"},
        {text:"the argument that no one was going to win."},
        {text:"Like an old song surfacing,"},
        {text:"while you\u2019re doing the dishes."}
      ],
      [
        {text:"What\u2019s left isn\u2019t the storm, or the song -"},
        {text:"it\u2019s what stayed after both of them passed."}
      ],
      [
        {text:"Some things stay soft inside you -"},
        {text:"not wounds, not wishes."},
        {text:"Just proof that once,"},
        {text:"something mattered."},
        {text:"And that is enough."},
        {text:"That has always been enough."}
      ],
      [
        {text:"It comes not from having,", italic:true},
        {text:"it comes from being.", italic:true}
      ]
    ]
  },
  {
    slug: "still-standing",
    type: "poem",
    title: "Still Standing",
    stanzas: [
      [
        {text:"A stifled voice,"},
        {text:"a buried argument,"},
        {text:"the nothings that became sorrow,"},
        {text:"maybe we will talk about them tomorrow."}
      ],
      [
        {text:"Home moved an inch away -"},
        {text:"not a crack in the paint -"},
        {text:"even while we stayed."}
      ]
    ]
  },
  {
    slug: "elsewhere",
    type: "poem",
    title: "Elsewhere",
    stanzas: [
      [
        {text:"They sat at the same table,"},
        {text:"steam rising from both the mugs."},
        {text:"Thumbs moving faster"},
        {text:"than anything that\u2019s said."}
      ],
      [
        {text:"She laughs - not at something he said."},
        {text:"He nods - not at her."}
      ],
      [
        {text:"The mugs go quiet between them."},
        {text:"The steam gives up before they do."}
      ],
      [
        {text:"Not lonely, exactly."},
        {text:"Just elsewhere -"},
        {text:"two worlds sharing a table,"},
        {text:"never quite the same room."}
      ]
    ]
  },
  {
    slug: "another-way-around",
    type: "poem",
    title: "Another Way Around",
    stanzas: [
      [
        {text:"The mountain spring pushing against the rock,"},
        {text:"never certain if the silence means no, or nothing at all,"},
        {text:"it stops pushing, finds another way around -"},
        {text:"calls it patience, calls it moving on."}
      ],
      [
        {text:"\u201cHelp\u201d comes to the tip of the tongue,"},
        {text:"uncertain if anyone\u2019s listening on the other side."},
        {text:"So it stays there, unsaid,"},
        {text:"and something smaller takes its place."}
      ],
      [
        {text:"The rock stays,"},
        {text:"never having to answer,"},
        {text:"never having been asked."}
      ]
    ]
  },
  {
    slug: "mirrors-to-the-soul",
    type: "poem",
    title: "Mirrors to the Soul",
    stanzas: [
      [
        {text:"They hold back a brewing storm,"},
        {text:"to show a surface that\u2019s calm."},
        {text:"The water wavers sometimes,"},
        {text:"a drop of silence rolls down."}
      ],
      [
        {text:"The world sees the smile,"},
        {text:"not the sadness it conceals."},
        {text:"Only one once found the way through,"},
        {text:"until even they looked away."}
      ],
      [
        {text:"The storm rages on,"},
        {text:"under the mirrors to the soul."}
      ]
    ]
  },
  {
    slug: "the-quiet-meadow",
    type: "poem",
    title: "The Quiet Meadow",
    stanzas: [
      [
        {text:"Like a bridge built of fog, that carries it all,"},
        {text:"unfulfilled dreams, big and small."},
        {text:"It is the courage for the impossible,"},
        {text:"it is the fear of falling short."}
      ],
      [
        {text:"Suspended between blooming and fading away,"},
        {text:"it\u2019s the twilight of thought, where reality sways,"},
        {text:"and every shadow can be a doorway."}
      ],
      [
        {text:"Between the sharp edges of \u201cyes\u201d and \u201cno,\u201d"},
        {text:"there is a quiet meadow,"},
        {text:"where impossible things gather to sleep."}
      ]
    ]
  },
  {
    slug: "silences",
    type: "poem",
    title: "Silences",
    stanzas: [
      [
        {text:"They speak for things left unsaid,"},
        {text:"or the biggest price of our dreams we paid."}
      ],
      [
        {text:"For griefs too old for words,"},
        {text:"and quiet moments of joy."},
        {text:"Like a chair in the room,"},
        {text:"that weighs more than the house."}
      ],
      [
        {text:"Comfortable as old shoes,"},
        {text:"and haunting as a dark road -"},
        {text:"the loudest thing in any room,"},
        {text:"long after the words are gone."}
      ]
    ]
  }
    ]
  },
  {
    slug: "mid-leap",
    title: "Mid-Leap",
    subtitle: "Notes on wonder, and the slow art of watching.",
    works: [
  {
    slug: "lets-find",
    type: "poem",
    title: "Let\u2019s Find",
    stanzas: [
      [
        {text:"Let\u2019s find a different sky,"},
        {text:"where sunsets do not offer apology,"},
        {text:"and stars are not shy."}
      ],
      [
        {text:"Let\u2019s find that meadow,"},
        {text:"where flowers bloom,"},
        {text:"and don\u2019t fear the vase."}
      ],
      [
        {text:"Let\u2019s find the woods,"},
        {text:"that hide secrets of old,"},
        {text:"where the wild things are."}
      ],
      [
        {text:"Let\u2019s find that river,"},
        {text:"flowing like ruthless march of time,"},
        {text:"not in a hurry to be anywhere."}
      ]
    ]
  },
  {
    slug: "fables",
    type: "poem",
    title: "Fables",
    stanzas: [
      [
        {text:"Walking amongst giants,"},
        {text:"each with a fable of its own."},
        {text:"A name carved with love,"},
        {text:"a swing the child has outgrown."}
      ],
      [
        {text:"They grieve with leaves,"},
        {text:"make feathered music,"},
        {text:"winds carrying their voices -"},
        {text:"quiet, like petrichor."}
      ],
      [
        {text:"Only with steps that don\u2019t quicken,"},
        {text:"they save the stories for those who care to listen."}
      ]
    ]
  },
  {
    slug: "mid-leap",
    type: "poem",
    title: "Mid-Leap",
    stanzas: [
      [
        {text:"I saw a car chasing a dog,"},
        {text:"a clown with a funny nose,"},
        {text:"a whale that melted mid-leap,"},
        {text:"a castle that no one chose,"},
        {text:"painted in white on a blue canvas,"},
        {text:"giving imagination a chance."}
      ],
      [
        {text:"Oh, if only it could paint our memories,"},
        {text:"of the days when dreams were not so scarce,"},
        {text:"when lying on grass was the only plan,"},
        {text:"and time moved slow enough to touch."}
      ],
      [
        {text:"Now the sky still shifts and wanders,"},
        {text:"but we\u2019ve forgotten how to watch."}
      ]
    ]
  }
    ]
  },
  {
    slug: "before-its-done",
    title: "Before It\u2019s Done",
    subtitle: "On endings, and the things we do before they arrive.",
    works: [
  {
    slug: "for-no-reason-at-all",
    type: "poem",
    title: "For No Reason At All",
    stanzas: [
      [
        {text:"Where time pauses and slows,"},
        {text:"and is measured in shadows."},
        {text:"Where the wind whistles a melody,"},
        {text:"tempting you with a lullaby."},
        {text:"Where evenings put on a show,"},
        {text:"with colors around the dying sun."}
      ],
      [
        {text:"Let\u2019s go to those hills,"},
        {text:"where the grass dances -"},
        {text:"for no reason at all."}
      ],
      [
        {text:"Let\u2019s find new heartbreaks,"},
        {text:"with fresh scars burying the old ones."},
        {text:"Let\u2019s live a lifetime,"},
        {text:"before the day is done."}
      ]
    ]
  },
  {
    slug: "not-in-the-same-room",
    type: "poem",
    title: "Not in the Same Room",
    stanzas: [
      [
        {text:"Don\u2019t bury me deep,"},
        {text:"for I fear the dark,"},
        {text:"I care not for the tomb,"},
        {text:"nor for the beautiful arch."}
      ],
      [
        {text:"Set me free in the mountains,"},
        {text:"where birds nest unseen,"},
        {text:"and wind tickles the trees."}
      ],
      [
        {text:"Send me in the gentle meadows,"},
        {text:"and I will be a wisp of cloud,"},
        {text:"I will be the song of a thrush,"},
        {text:"and in the hoot of the owl."}
      ],
      [
        {text:"Don\u2019t miss me when I am gone,"},
        {text:"I will be holding your hand,"},
        {text:"just not in the same room."}
      ],
      [
        {text:"I will be there, if you just take a look around.", italic:true}
      ]
    ]
  }
    ]
  },
  {
    slug: "convictions",
    title: "Convictions",
    subtitle: "Fables about what gets destroyed for refusing to fit.",
    works: [
  {
    slug: "the-taming",
    type: "poem",
    title: "The Taming",
    stanzas: [
      [
        {text:"They rounded up the feral ones who howled instead of talked,"},
        {text:"Who climbed before they toddled and ran before they walked."},
        {text:"They combed the burrs out of their hair and trimmed their ragged nails,"},
        {text:"And swapped their capes of leaves and mud for zippers and for scales."}
      ],
      [
        {text:"They taught them how to raise a hand and wait to be called on,"},
        {text:"They taught them please and thank you till the growling in them shone."},
        {text:"They fenced the creek they swam in and they paved the tree they climbed,"},
        {text:"They set a clock beside their bed and told them when it\u2019s time."}
      ],
      [
        {text:"They said the mud was dirty and the thunder was too loud,"},
        {text:"They said a child who talks to crows should not do so out loud."},
        {text:"They brushed the wild right off of them like dust from a good coat -"},
        {text:"And that is why the last wolf-child is only a old folks\u2019 quote."}
      ]
    ],
    postscript: "ps: Heavily inspired from \u201cWild Child\u201d by <a href=\"https://www.facebook.com/esquinapoetica/posts/-from-wild-child-by-jekt/\" target=\"_blank\" rel=\"noopener noreferrer\">Jeanne Willis</a>"
  },
  {
    slug: "the-trial",
    type: "poem",
    title: "The Trial",
    stanzas: [
      [
        {text:"I remember the day it was killed,"},
        {text:"when everyone gathered with glee,"},
        {text:"they brought it all chained,"},
        {text:"and asked, \u201cHow do you plead?\u201d"}
      ],
      [
        {text:"The Dream looked up, all sincere,"},
        {text:"unflinching, saying nothing,"},
        {text:"searching into the crowd,"},
        {text:"for Hope, but did not find it there."}
      ],
      [
        {text:"Judges wore the mask of kindness,"},
        {text:"sitting in high chair,"},
        {text:"\u201cGuilty,\u201d they said, \u201cyou don\u2019t fit the mold,\u201d"},
        {text:"but Dream refused to be harnessed."}
      ],
      [
        {text:"They raked it over the coals,"},
        {text:"whipped it bloody till it tore,"},
        {text:"looking around for its friend,"},
        {text:"its glassy eyes looked forlorn."}
      ],
      [
        {text:"With bloodied hands, they dug a hole,"},
        {text:"buried Dream in it, and covered it with stones."},
        {text:"They did not see from behind their slipping masks -"},
        {text:"Hope was carrying its soul."}
      ]
    ]
  }
    ]
  }
];

/* ============ helpers ============ */

function toRoman(num){
  var map = [[1000,"M"],[900,"CM"],[500,"D"],[400,"CD"],[100,"C"],[90,"XC"],
    [50,"L"],[40,"XL"],[10,"X"],[9,"IX"],[5,"V"],[4,"IV"],[1,"I"]];
  var res = "";
  for (var i = 0; i < map.length; i++){
    var v = map[i][0], s = map[i][1];
    while (num >= v){ res += s; num -= v; }
  }
  return res;
}

function findCollection(slug){
  for (var i = 0; i < collections.length; i++){
    if (collections[i].slug === slug) return collections[i];
  }
  return null;
}

function findWorkIndex(collection, slug){
  for (var i = 0; i < collection.works.length; i++){
    if (collection.works[i].slug === slug) return i;
  }
  return -1;
}

/* search every collection for a work slug (used for legacy links) */
function findAnywhere(slug){
  for (var i = 0; i < collections.length; i++){
    var idx = findWorkIndex(collections[i], slug);
    if (idx !== -1) return { collection: collections[i], index: idx };
  }
  return null;
}

function renderWorkBody(work){
  var i, j;
  if (work.type === "story"){
    var pHtml = "";
    for (i = 0; i < work.paragraphs.length; i++){
      pHtml += "<p>" + work.paragraphs[i] + "</p>";
    }
    return '<div class="prose">' + pHtml + "</div>";
  }
  var stanzaHtml = "";
  for (i = 0; i < work.stanzas.length; i++){
    var st = work.stanzas[i];
    var lines = "";
    for (j = 0; j < st.length; j++){
      var l = st[j];
      lines += '<p' + (l.italic ? ' class="italic"' : '') + '>' + l.text + '</p>';
    }
    stanzaHtml += '<div class="stanza">' + lines + '</div>';
  }
  return '<div class="poem">' + stanzaHtml + '</div>';
}

function renderIllustration(src){
  return '<div class="illustration">' + (src ? '<img src="' + src + '" alt="">' : '') + '</div>';
}

function renderPoemPage(collection, index){
  var work = collection.works[index];
  var prev = collection.works[index - 1];
  var next = collection.works[index + 1];
  var pageNum = toRoman(index + 1);
  var total = toRoman(collection.works.length);
  var base = "#/c/" + collection.slug + "/work/";

  var prevLink = prev
    ? '<a href="' + base + prev.slug + '">&larr; ' + prev.title + '</a>'
    : '<span class="disabled">&larr;</span>';
  var nextLink = next
    ? '<a href="' + base + next.slug + '">' + next.title + ' &rarr;</a>'
    : '<span class="disabled">&rarr;</span>';

  return (
    '<article class="leaf">' +
      renderIllustration(work.illustrationTop) +
      '<div class="content">' +
        '<h1 class="title">' + work.title + '</h1>' +
        '<div class="rule"></div>' +
        renderWorkBody(work) +
        (work.postscript ? '<p class="postscript">' + work.postscript + '</p>' : '') +
      '</div>' +
      renderIllustration(work.illustrationBottom) +
      '<div class="foot-nav">' +
        prevLink +
        '<span class="num">' + pageNum + ' / ' + total + '</span>' +
        nextLink +
      '</div>' +
    '</article>'
  );
}

function renderCover(collection){
  var items = "";
  for (var i = 0; i < collection.works.length; i++){
    items += (
      '<li>' +
        '<span class="num">' + toRoman(i+1) + '</span>' +
        '<a href="#/c/' + collection.slug + '/work/' + collection.works[i].slug + '">' + collection.works[i].title + '</a>' +
      '</li>'
    );
  }

  return (
    '<article class="leaf">' +
      '<div class="illustration"></div>' +
      '<div class="content">' +
        '<div class="cover-title">' + collection.title + '</div>' +
        '<div class="cover-sub">' + collection.subtitle + '</div>' +
        '<ul class="toc">' + items + '</ul>' +
      '</div>' +
      '<div class="illustration"></div>' +
    '</article>'
  );
}

function renderSiteNav(activeSlug){
  var html = "";
  for (var i = 0; i < collections.length; i++){
    if (i > 0) html += '<span class="sep">&middot;</span>';
    var c = collections[i];
    var cls = (c.slug === activeSlug) ? ' class="active"' : '';
    html += '<a href="#/c/' + c.slug + '"' + cls + '>' + c.title + '</a>';
  }
  return html;
}

/* ============ router ============ */

var stage = document.getElementById("stage");
var navEl = document.getElementById("site-nav");

function route(){
  var hash = location.hash || "";
  var workMatch = hash.match(/^#\/c\/([^\/]+)\/work\/(.+)$/);
  var coverMatch = hash.match(/^#\/c\/([^\/]+)$/);
  var legacyMatch = hash.match(/^#\/work\/(.+)$/);

  if (legacyMatch){
    var found = findAnywhere(legacyMatch[1]);
    if (found){
      location.hash = "#/c/" + found.collection.slug + "/work/" + legacyMatch[1];
    } else {
      location.hash = "#/c/" + collections[0].slug;
    }
    return;
  }

  stage.innerHTML = "";

  if (workMatch){
    var collection = findCollection(workMatch[1]);
    if (!collection){ location.hash = "#/c/" + collections[0].slug; return; }
    var idx = findWorkIndex(collection, workMatch[2]);
    if (idx === -1){ location.hash = "#/c/" + collection.slug; return; }
    document.body.classList.remove("on-cover");
    navEl.innerHTML = renderSiteNav(collection.slug);
    stage.innerHTML = renderPoemPage(collection, idx);
  } else if (coverMatch){
    var collection2 = findCollection(coverMatch[1]);
    if (!collection2){ location.hash = "#/c/" + collections[0].slug; return; }
    document.body.classList.add("on-cover");
    navEl.innerHTML = renderSiteNav(collection2.slug);
    stage.innerHTML = renderCover(collection2);
  } else {
    location.hash = "#/c/" + collections[0].slug;
    return;
  }

  window.scrollTo(0,0);
}

window.addEventListener("hashchange", route);
document.addEventListener("keydown", function(e){
  var hash = location.hash || "";
  var match = hash.match(/^#\/c\/([^\/]+)\/work\/(.+)$/);
  if (!match) return;
  var collection = findCollection(match[1]);
  if (!collection) return;
  var idx = findWorkIndex(collection, match[2]);
  if (idx === -1) return;
  var base = "#/c/" + collection.slug + "/work/";
  if (e.key === "ArrowRight" && collection.works[idx+1]) location.hash = base + collection.works[idx+1].slug;
  if (e.key === "ArrowLeft" && collection.works[idx-1]) location.hash = base + collection.works[idx-1].slug;
  if (e.key === "ArrowLeft" && idx === 0) location.hash = "#/c/" + collection.slug;
});

route();
</script>
